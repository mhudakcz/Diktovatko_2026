<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diktovátko – historie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --fog: #EEF1F5;
  --paper: #FFFFFF;
  --ink: #1B2230;
  --ink-2: #4A5366;
  --muted: #7B8496;
  --line: #DCE1E9;
  --ultra: #3847F5;
  --ultra-soft: #E6E8FE;
  --voice: #F0405A;
  --sel: #E9EBFE;
  --display: "Bricolage Grotesque", "Segoe UI Variable Display", "Segoe UI", sans-serif;
  --body: "Onest", "Segoe UI Variable Text", "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fog: #12151C; --paper: #1A1F29; --ink: #E8EBF2; --ink-2: #B5BCCB; --muted: #7F889B;
    --line: #2A3140; --ultra: #8490FF; --ultra-soft: #262C4F; --sel: #1F2440; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fog); color: var(--ink); font: 14px/1.45 var(--body);
  display: grid; grid-template-columns: 228px 1fr; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ultra); outline-offset: 2px; }

/* ---------- postranní panel ---------- */
aside {
  padding: 18px 14px 14px 16px; display: flex; flex-direction: column; gap: 14px;
  border-right: 1px solid var(--line); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; font: 700 16px/1 var(--display); letter-spacing: -0.01em; }
.brand-mark { width: 24px; height: 24px; border-radius: 50%; background: var(--voice); display: grid; place-items: center; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 10px; border: 3px solid var(--fog); }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 60%, transparent); }
::-webkit-scrollbar-button { display: none; }
.brand-mark svg { width: 12px; height: 12px; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); }
.search input {
  width: 100%; padding: 7px 10px 7px 32px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--paper); outline: none;
}
.search input:focus { border-color: var(--ultra); box-shadow: 0 0 0 3px var(--ultra-soft); }
.group h2 { margin: 0 0 4px 8px; font: 500 12px/1 var(--body); color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  padding: 4px 8px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; color: var(--ink-2);
}
.nav button:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.nav button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 0 var(--line); }
.nav .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.app-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 9px; flex: none; }
.app-name { display: flex; align-items: center; min-width: 0; }
.app-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot { margin-top: auto; font-size: 12px; color: var(--muted); line-height: 1.45; }
.foot kbd { font: 600 12px var(--body); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--paper); color: var(--ink-2); }

/* ---------- hlavní část ---------- */
main { overflow-y: auto; scroll-behavior: smooth; }
.wrap { max-width: 1040px; padding: 18px 28px 110px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
header h1 { margin: 0; font: 700 24px/1.1 var(--display); letter-spacing: -0.02em; }
.summary { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; font-size: 13px;
  border: 1px solid var(--line); background: var(--paper); cursor: pointer; white-space: nowrap; font-weight: 500;
}
.btn:hover { border-color: var(--muted); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--ultra); border-color: var(--ultra); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }

.day { margin-top: 12px; }
.day h3 {
  position: sticky; top: 0; z-index: 2; margin: 0; padding: 6px 0;
  background: var(--fog); font: 600 14px/1.2 var(--display); letter-spacing: -0.01em;
}
.day h3 small { font: 400 12.5px var(--body); color: var(--muted); margin-left: 8px; }

/* časová osa */
.entries { position: relative; margin: 0; padding: 0; list-style: none; }
.entries::before { content: ""; position: absolute; left: 55px; top: 10px; bottom: 10px; width: 2px; background: var(--line); border-radius: 2px; }
.entry {
  position: relative; display: grid; grid-template-columns: 42px 28px 1fr auto; align-items: start;
  padding: 5px 8px 5px 0; border-radius: 8px; cursor: pointer;
}
.entry:hover { background: color-mix(in srgb, var(--paper) 70%, transparent); }
.entry[aria-selected="true"] { background: var(--sel); }
.time { font: 500 12px/21px var(--body); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.node { justify-self: center; margin-top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--paper); border: 2px solid var(--c, var(--muted)); position: relative; z-index: 1; transition: transform .15s; }
.entry[aria-selected="true"] .node { background: var(--c); transform: scale(1.25); }
.body { min-width: 0; }
.text { margin: 0; font-size: 14.5px; line-height: 1.45; color: var(--ink); max-width: 110ch; user-select: text; cursor: text; }
.meta { display: flex; align-items: center; gap: 8px; margin-top: 1px; font-size: 12px; color: var(--muted); min-width: 0; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 0 7px 0 6px; border-radius: 999px; line-height: 18px; background: color-mix(in srgb, var(--c) 13%, transparent); color: color-mix(in srgb, var(--c) 70%, var(--ink)); font-weight: 600; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dur { flex: none; font-variant-numeric: tabular-nums; }
.copy1 {
  opacity: 0; margin-left: 6px; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--paper); display: grid; place-items: center; cursor: pointer; color: var(--ink-2);
}
.copy1 svg { width: 13px; height: 13px; }
.entry:hover .copy1, .copy1:focus-visible { opacity: 1; }
.copy1:hover { color: var(--ultra); border-color: var(--ultra); }
mark { background: color-mix(in srgb, var(--ultra) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

.empty { margin-top: 12vh; max-width: 440px; }
.empty h2 { font: 700 26px/1.2 var(--display); margin: 0 0 10px; letter-spacing: -0.015em; }
.empty p { color: var(--ink-2); margin: 0; }

/* akční lišta výběru */
.bar {
  position: fixed; left: calc(228px + (100vw - 228px) / 2); bottom: 24px; translate: -50% 140%;
  display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 14px; border-radius: 12px; font-size: 13px;
  background: var(--ink); color: var(--fog); box-shadow: 0 12px 32px -8px rgb(15 20 35 / .45);
  transition: translate .25s cubic-bezier(.2,.8,.2,1); z-index: 5;
}
.bar.on { translate: -50% 0; }
.bar .count { font-weight: 600; margin-right: 8px; white-space: nowrap; }
.bar button { border: 0; border-radius: 8px; padding: 6px 10px; background: color-mix(in srgb, var(--fog) 12%, transparent); color: inherit; cursor: pointer; white-space: nowrap; }
.bar button:hover { background: color-mix(in srgb, var(--fog) 22%, transparent); }
.bar button.go { background: var(--ultra); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar button.go { color: #10132a; } }
.toast {
  position: fixed; right: 24px; top: 20px; padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--fog);
  font-weight: 500; opacity: 0; translate: 0 -8px; transition: .2s; pointer-events: none; z-index: 6;
}
.toast.on { opacity: 1; translate: 0 0; }

@media (max-width: 900px) {
  body { grid-template-columns: 200px 1fr; }
  .wrap { padding: 16px 18px 110px; }
  .bar { left: calc(200px + (100vw - 200px) / 2); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="8" y="2" width="8" height="13" rx="4" fill="#fff" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></span>
    Diktovátko
  </div>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Hledat" aria-label="Hledat">
  </label>
  <div class="group">
    <h2>Období</h2>
    <div class="nav" id="periods"></div>
  </div>
  <div class="group" id="apps-group">
    <h2>Aplikace</h2>
    <div class="nav" id="apps"></div>
  </div>
  <div class="foot">Klikem vyberete záznam, <kbd>Ctrl</kbd>+<kbd>A</kbd> vybere vše zobrazené, <kbd>Ctrl</kbd>+<kbd>C</kbd> zkopíruje text.</div>
</aside>

<main id="main">
  <div class="wrap">
    <header>
      <div>
        <h1 id="title">Posledních 7 dní</h1>
        <p class="summary" id="summary"></p>
      </div>
      <button class="btn" id="export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        Exportovat do Markdownu
      </button>
    </header>
    <div id="list"></div>
  </div>
</main>

<div class="bar" id="bar" role="toolbar" aria-label="Vybrané záznamy">
  <span class="count" id="selcount"></span>
  <button class="go" id="copy-text">Kopírovat text</button>
  <button id="copy-meta">Kopírovat s časem a oknem</button>
  <button id="clear">Zrušit výběr</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const PERIODS = [
  ["today", "Dnes"], ["7d", "Posledních 7 dní"], ["month", "Tento měsíc"],
  ["last_month", "Minulý měsíc"], ["90d", "Posledních 90 dní"], ["all", "Vše"],
];
const APP_NAMES = {
  "chrome.exe": "Chrome", "msedge.exe": "Edge", "firefox.exe": "Firefox", "slack.exe": "Slack",
  "outlook.exe": "Outlook", "olk.exe": "Outlook", "ms-teams.exe": "Teams", "teams.exe": "Teams",
  "code.exe": "VS Code", "cursor.exe": "Cursor", "claude.exe": "Claude", "winword.exe": "Word",
  "excel.exe": "Excel", "powerpnt.exe": "PowerPoint", "notepad.exe": "Poznámkový blok",
  "explorer.exe": "Průzkumník", "whatsapp.exe": "WhatsApp", "telegram.exe": "Telegram",
  "windowsterminal.exe": "Terminál", "notion.exe": "Notion", "obsidian.exe": "Obsidian",
};
const TITLE_SUFFIXES = [/\s[-–—]\s(Google Chrome|Mozilla Firefox|Microsoft​? Edge|Microsoft Edge)$/, /\s[-–—]\s?Profil.*$/];
const PALETTE = ["#3847F5", "#E0457B", "#0E9F8E", "#E08A12", "#7A4BE0", "#2F8FE0", "#C24DD1", "#5B8C1F"];

const state = { period: "7d", q: "", app: null, rows: [], shown: [], selected: new Set(), hotkey: "right ctrl" };
const $ = (id) => document.getElementById(id);

function appLabel(exe) { return APP_NAMES[(exe || "").toLowerCase()] || (exe || "Neznámá aplikace").replace(/\.exe$/i, ""); }
function appColor(exe) {
  let h = 0; for (const ch of (exe || "").toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function cleanTitle(t) { t = t || ""; for (const re of TITLE_SUFFIXES) t = t.replace(re, ""); return t; }
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function highlight(s) {
  const safe = esc(s || "");
  if (!state.q) return safe;
  const re = new RegExp(state.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return safe.replace(re, (m) => `<mark>${m}</mark>`);
}
function dayLabel(iso) {
  const d = new Date(iso + "T00:00:00"), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 864e5);
  const full = d.toLocaleDateString("cs-CZ", { weekday: "long", day: "numeric", month: "long" });
  if (diff === 0) return ["Dnes", full];
  if (diff === 1) return ["Včera", full];
  return [full.charAt(0).toUpperCase() + full.slice(1), d.getFullYear() !== today.getFullYear() ? d.getFullYear() : ""];
}
function plural(n, one, few, many) { return n === 1 ? one : n >= 2 && n <= 4 ? few : many; }
function fmtDur(s) { s = Math.round(s || 0); return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60 ? (s % 60) + " s" : ""}`.trim(); }

function renderPeriods() {
  $("periods").innerHTML = PERIODS.map(([k, l]) => `<button aria-pressed="${k === state.period}" data-p="${k}">${l}</button>`).join("");
}
function renderApps() {
  const counts = {};
  for (const r of state.rows) counts[r.app] = (counts[r.app] || 0) + 1;
  const apps = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  $("apps-group").hidden = apps.length === 0;
  $("apps").innerHTML =
    `<button aria-pressed="${state.app === null}" data-a=""><span class="app-name"><span>Všechny aplikace</span></span><span class="n">${state.rows.length}</span></button>` +
    apps.map(([a, n]) => `<button aria-pressed="${state.app === a}" data-a="${esc(a || "")}"><span class="app-name"><span class="app-dot" style="background:${appColor(a)}"></span><span>${esc(appLabel(a))}</span></span><span class="n">${n}</span></button>`).join("");
}
function renderList() {
  state.shown = state.rows.filter((r) => state.app === null || r.app === state.app);
  const secs = state.shown.reduce((s, r) => s + (r.audio_seconds || 0), 0);
  const words = state.shown.reduce((s, r) => s + r.text.split(/\s+/).filter(Boolean).length, 0);
  const n = state.shown.length;
  $("title").textContent = PERIODS.find(([k]) => k === state.period)[1];
  $("summary").textContent = n
    ? `${n} ${plural(n, "záznam", "záznamy", "záznamů")}, ${words} ${plural(words, "slovo", "slova", "slov")}, nadiktováno za ${fmtDur(secs)}`
    : "";
  if (!n) {
    const key = state.hotkey.replace("right ctrl", "pravý Ctrl");
    $("list").innerHTML = state.q || state.app
      ? `<div class="empty"><h2>Nic neodpovídá hledání</h2><p>Zkuste jiné slovo nebo delší období v levém panelu.</p></div>`
      : `<div class="empty"><h2>Zatím tu nic není</h2><p>Klikněte do libovolného textového pole, podržte <b>${esc(key)}</b>, řekněte, co potřebujete, a klávesu pusťte. Přepis se vloží na místo kurzoru a objeví se tady.</p></div>`;
    return;
  }
  const byDay = new Map();
  for (const r of state.shown) {
    const d = r.ts.slice(0, 10);
    if (!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(r);
  }
  let html = "";
  for (const [d, rows] of byDay) {
    const [label, sub] = dayLabel(d);
    html += `<section class="day"><h3>${label}<small>${sub}</small></h3><ol class="entries">`;
    for (const r of rows) {
      const c = appColor(r.app);
      html += `<li class="entry" data-id="${r.id}" aria-selected="${state.selected.has(r.id)}" style="--c:${c}">
        <span class="time">${r.ts.slice(11, 16)}</span><span class="node"></span>
        <div class="body"><p class="text">${highlight(r.text)}</p>
          <div class="meta"><span class="chip">${esc(appLabel(r.app))}</span><span class="where" title="${esc(r.window_title || "")}">${highlight(cleanTitle(r.window_title))}</span></div>
        </div>
        <button class="copy1" title="Kopírovat tento text" aria-label="Kopírovat tento text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
      </li>`;
    }
    html += `</ol></section>`;
  }
  $("list").innerHTML = html;
}
function renderBar() {
  const n = state.selected.size;
  $("bar").classList.toggle("on", n > 0);
  if (n) $("selcount").textContent = `Vybráno ${n}`;
}
function renderAll() { renderPeriods(); renderApps(); renderList(); renderBar(); }

async function load() {
  state.rows = await window.pywebview.api.entries(state.period, state.q);
  if (state.app !== null && !state.rows.some((r) => r.app === state.app)) state.app = null;
  const ids = new Set(state.rows.map((r) => r.id));
  for (const id of [...state.selected]) if (!ids.has(id)) state.selected.delete(id);
  renderAll();
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1800);
}
function selectedRows() { return [...state.shown].reverse().filter((r) => state.selected.has(r.id)); } // chronologicky
async function copyRows(rows, withMeta) {
  if (!rows.length) return;
  const out = withMeta
    ? rows.map((r) => `[${r.ts.replace("T", " ").slice(0, 16)}] ${appLabel(r.app)}: ${cleanTitle(r.window_title)}\n${r.text}`).join("\n\n")
    : rows.map((r) => r.text).join("\n");
  await window.pywebview.api.copy(out);
  toast(rows.length === 1 ? "Zkopírováno" : `Zkopírováno ${rows.length} ${plural(rows.length, "záznam", "záznamy", "záznamů")}`);
}

$("periods").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.period = b.dataset.p; state.selected.clear(); load(); } });
$("apps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.app = b.dataset.a === "" ? null : b.dataset.a; renderApps(); renderList(); } });
let qTimer;
$("q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); load(); }, 150); });
$("list").addEventListener("click", (e) => {
  const li = e.target.closest(".entry"); if (!li) return;
  const id = +li.dataset.id;
  if (e.target.closest(".copy1")) { copyRows(state.shown.filter((r) => r.id === id), false); return; }
  if (String(window.getSelection())) return; // uživatel si označuje text ručně
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  li.setAttribute("aria-selected", state.selected.has(id));
  renderBar();
});
$("copy-text").onclick = () => copyRows(selectedRows(), false);
$("copy-meta").onclick = () => copyRows(selectedRows(), true);
$("clear").onclick = () => { state.selected.clear(); renderList(); renderBar(); };
$("export").onclick = async () => { const n = await window.pywebview.api.export(state.period, state.q); toast(`Exportováno ${n} ${plural(n, "záznam", "záznamy", "záznamů")}`); };
document.addEventListener("keydown", (e) => {
  const inInput = e.target.tagName === "INPUT";
  if (e.key === "/" && !inInput) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Escape") { if (inInput && e.target.value) return; state.selected.clear(); renderList(); renderBar(); }
  else if (e.ctrlKey && e.key.toLowerCase() === "a" && !inInput) { e.preventDefault(); state.shown.forEach((r) => state.selected.add(r.id)); renderList(); renderBar(); }
  else if (e.ctrlKey && e.key.toLowerCase() === "c" && !inInput && !String(window.getSelection()) && state.selected.size) { e.preventDefault(); copyRows(selectedRows(), false); }
  else if (e.key === "F5") { e.preventDefault(); load(); }
});
window.addEventListener("focus", () => window.pywebview && load());
window.addEventListener("pywebviewready", async () => {
  state.hotkey = (await window.pywebview.api.settings()).hotkey;
  load();
});
</script>
</body>
</html>
